<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Accordion و Tabs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./tailwind/tailwind.css">
</head>
<body class="p-8 max-w-xl mx-auto space-y-10">

  <!-- Accordion -->
  <div id="acc" class="space-y-2">
    <button class="acc-head w-full text-right bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded">بخش ۱</button>
    <div class="panel hidden p-2.5 border border-gray-300">محتوای ۱</div>

    <button class="acc-head w-full text-right bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded">بخش ۲</button>
    <div class="panel hidden p-2.5 border border-gray-300">محتوای ۲</div>

    <button class="acc-head w-full text-right bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded">بخش ۳</button>
    <div class="panel hidden p-2.5 border border-gray-300">محتوای ۳</div>
  </div>

  <!-- Tabs -->
  <div id="tabs">
    <div class="flex gap-2 mb-2">
      <button class="tab-btn bg-yellow-400 px-4 py-2 rounded" data-tab="t1">تب ۱</button>
      <button class="tab-btn bg-gray-100 px-4 py-2 rounded" data-tab="t2">تب ۲</button>
      <button class="tab-btn bg-gray-100 px-4 py-2 rounded" data-tab="t3">تب ۳</button>
    </div>
    <div class="panel block p-2.5 border border-gray-300" id="t1">محتوای تب ۱</div>
    <div class="panel hidden p-2.5 border border-gray-300" id="t2">محتوای تب ۲</div>
    <div class="panel hidden p-2.5 border border-gray-300" id="t3">محتوای تب ۳</div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</body>
</html>
